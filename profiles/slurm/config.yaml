executor: slurm
software-deployment-method:
  - pixi
# Snakemake copies every env package here. pixi installs from its own cache.
# One copy per user instead of one per workdir.
software-deployment-cache-prefix: ~/.cache/snakemake/software

jobs: 40
max-jobs-per-timespan: 5/1s

slurm-efficiency-report: true
slurm-efficiency-report-path: logs/efficiency
slurm-efficiency-threshold: 0.8

default-resources:
  slurm_account: ramirezc
  slurm_partition: 12hours
  runtime: 60m
  mem_mb: 4000
  # These nodes lack the /data mount that the sra-chip FASTQs live on.
  slurm_extra: "--exclude=z1056,z1058,z1062,z1016"

set-threads:
  bowtie2_index: 16
  trim: 4
  align: 8
  dedup: 4
  tracks: 2

set-resources:              # tune from benchmarks/ TSVs after a real run
  bowtie2_index:
    mem_mb: 16000 * attempt
    runtime: 600m
  trim:
    mem_mb: 4000 * attempt
    runtime: 240m
  align:
    mem_mb: 16000 * attempt
    runtime: 600m
  dedup:
    mem_mb: 4000 * attempt
    runtime: 120m
  tracks:
    mem_mb: 16000 * attempt
    runtime: 120m
  macs3:
    mem_mb: 8000 * attempt
    runtime: 120m
  idr:
    mem_mb: 4000 * attempt
    runtime: 60m

rerun-incomplete: true
keep-going: true
show-failed-logs: true
benchmark-extended: true
retries: 1
slurm-requeue: false
printshellcmds: true
latency-wait: 60
